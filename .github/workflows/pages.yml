name: CrabPDF website

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'assets/crabpdf-logo.svg'
      - 'docs/screenshots/**'
      - 'docs/releases/*-publication.json'
      - 'docs/site/**'
      - 'scripts/Build-ExtensionExample.ps1'
      - 'crates/extension-api/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'assets/crabpdf-logo.svg'
      - 'docs/screenshots/**'
      - 'docs/releases/*-publication.json'
      - 'docs/site/**'
      - 'scripts/Build-ExtensionExample.ps1'
      - 'crates/extension-api/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crabpdf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-2022
            target: i686-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust and target
        run: rustup target add '${{ matrix.target }}'
      - name: Fetch locked SDK dependencies
        run: cargo fetch --locked --target '${{ matrix.target }}'
      - name: Build the example ZIP
        shell: pwsh
        run: ./scripts/Build-ExtensionExample.ps1 -Target '${{ matrix.target }}' -Archive
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-example-${{ matrix.target }}
          path: artifacts/site-extensions/*.zip
          if-no-files-found: error

  build:
    needs: example-packages
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-example-*
          merge-multiple: true
          path: artifacts/site-extensions
      - name: Install website build tools
        working-directory: docs
        run: npm ci --no-audit --no-fund
      - name: Build static website and check references
        working-directory: docs
        run: npm run build && npm run check
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload public files
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy CrabPDF
        id: deployment
        uses: actions/deploy-pages@v4
