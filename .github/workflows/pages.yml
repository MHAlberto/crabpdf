name: CrabPDF website

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'assets/crabpdf-logo.svg'
      - 'docs/screenshots/**'
      - 'docs/releases/*-publication.json'
      - 'docs/site/**'
      - 'scripts/Build-ExtensionExample.ps1'
      - 'scripts/Build-ToolExtensions.ps1'
      - 'extensions/**'
      - 'docs/EXTENSIONS.md'
      - 'docs/USAGE.md'
      - 'docs/releases/*.md'
      - 'crates/extension-api/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'assets/crabpdf-logo.svg'
      - 'docs/screenshots/**'
      - 'docs/releases/*-publication.json'
      - 'docs/site/**'
      - 'scripts/Build-ExtensionExample.ps1'
      - 'scripts/Build-ToolExtensions.ps1'
      - 'extensions/**'
      - 'docs/EXTENSIONS.md'
      - 'docs/USAGE.md'
      - 'docs/releases/*.md'
      - 'crates/extension-api/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crabpdf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-example:
    # Reuse a verified build from main when only the website changed.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.artifacts.outputs.run }}
      pattern: ${{ steps.artifacts.outputs.pattern }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Find a matching build on main
        if: github.event_name == 'push'
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidates=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=10" \
            --jq '.workflow_runs[] | [.id, .head_sha] | @tsv')
          while IFS=$'\t' read -r run sha; do
            [[ "$run" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            git merge-base --is-ancestor "$sha" HEAD || continue
            git diff --quiet "$sha" HEAD -- Cargo.toml Cargo.lock rust-toolchain.toml LICENSE \
              crates/extension-api scripts/Build-ExtensionExample.ps1 scripts/Build-ToolExtensions.ps1 extensions docs/site/extensions.json || continue
            artifacts=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name')
            if grep -Fxq 'catalog-bundle' <<< "$artifacts"; then
              pattern=catalog-bundle
            elif [[ $(grep -c '^catalog-example-' <<< "$artifacts") == 5 ]]; then
              pattern='catalog-example-*'
            else
              continue
            fi
            printf 'run=%s\npattern=%s\n' "$run" "$pattern" >> "$GITHUB_OUTPUT"
            break
          done <<< "$candidates"

  example-packages:
    needs: reuse-example
    if: needs.reuse-example.outputs.run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-2022
            target: i686-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Rust and target
        run: rustup target add '${{ matrix.target }}'
      - name: Fetch locked SDK dependencies
        run: cargo fetch --locked --target '${{ matrix.target }}'
      - name: Install OCR build dependencies
        if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          python -m pip install --only-binary=:all: -r extensions/math-ocr/requirements.txt
      - name: Build extension packages
        shell: pwsh
        run: |
          ./scripts/Build-ExtensionExample.ps1 -Target '${{ matrix.target }}' -Archive
          ./scripts/Build-ToolExtensions.ps1 -Target '${{ matrix.target }}'
          if ('${{ matrix.target }}' -in @('x86_64-pc-windows-msvc', 'x86_64-unknown-linux-gnu')) {
            ./scripts/Build-ToolExtensions.ps1 -Target '${{ matrix.target }}' -Ocr
          }
          if ('${{ matrix.target }}' -eq 'x86_64-apple-darwin') {
            # Xcode links both architectures, and these packages run only after installation.
            rustup target add aarch64-apple-darwin
            if ($LASTEXITCODE) { throw 'No se pudo preparar el destino Apple Silicon.' }
            cargo fetch --locked --target aarch64-apple-darwin
            if ($LASTEXITCODE) { throw 'No se pudieron obtener las dependencias Apple Silicon.' }
            ./scripts/Build-ExtensionExample.ps1 -Target aarch64-apple-darwin -Archive
            ./scripts/Build-ToolExtensions.ps1 -Target aarch64-apple-darwin
          }
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-example-${{ matrix.target }}
          path: artifacts/site-extensions/*.zip
          if-no-files-found: error

  build:
    needs: [reuse-example, example-packages]
    if: >-
      !cancelled() && needs.reuse-example.result == 'success' &&
      (needs.example-packages.result == 'success' ||
      (needs.example-packages.result == 'skipped' && needs.reuse-example.outputs.run != ''))
    permissions:
      contents: read
      actions: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/download-artifact@v4
        if: needs.reuse-example.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.reuse-example.outputs.run }}
          pattern: ${{ needs.reuse-example.outputs.pattern }}
          merge-multiple: true
          path: artifacts/site-extensions
      - uses: actions/download-artifact@v4
        if: needs.reuse-example.outputs.run == ''
        with:
          pattern: catalog-example-*
          merge-multiple: true
          path: artifacts/site-extensions
      - name: Install website build tools
        working-directory: docs
        run: npm ci --no-audit --no-fund
      - name: Build static website and check references
        working-directory: docs
        run: npm run build && npm run check
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: catalog-bundle
          path: artifacts/site-extensions/*.zip
          if-no-files-found: error
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload public files
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy CrabPDF
        id: deployment
        uses: actions/deploy-pages@v4
