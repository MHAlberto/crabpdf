[package]
name = "crabpdf"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
description = "Un lector PDF de escritorio local, ligero y multiplataforma"
license = "MIT"

[build-dependencies]
embed-resource = "=3.0.11"
resvg = { version = "=0.48.1", default-features = false }

[dependencies]
crabpdf-core = { path = "crates/core" }
crabpdf-application = { path = "crates/application" }
crabpdf-runtime = { path = "crates/runtime" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "=0.17.2"
serde_json = "1.0"

[dev-dependencies]
crc32fast = "=1.5.2"
serde = { version = "1.0", features = ["derive"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "ico", "tga"] }
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace]
resolver = "3"
members = ["crates/core", "crates/application", "crates/runtime"]
