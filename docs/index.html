<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="https://mhalberto.github.io/crabpdf/site/assets/reading.png">
  <meta property="og:type" content="website">
  <title>{{ title }}</title>
  <link rel="canonical" href="{{ canonical }}">
  <link rel="icon" href="{{ root }}site/assets/crabpdf-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ root }}site/assets/site.css?v={{ css_revision }}">
  <script src="{{ root }}site/app.js?v={{ js_revision }}" defer></script>
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="wordmark" href="{{ root }}" aria-label="CrabPDF, inicio">
        <img src="{{ root }}site/assets/crabpdf-logo.svg" width="42" height="42" alt="">
        <span>CrabPDF</span>
      </a>
      <nav class="site-nav" aria-label="Navegación principal">{{ navigation }}</nav>
      <div class="masthead-tools">
        <a href="https://github.com/MHAlberto/crabpdf">GitHub</a>
        <button type="button" class="theme-button" data-theme-toggle hidden aria-label="Cambiar tema">◐</button>
      </div>
    </div>
  </header>
  <main id="contenido" tabindex="-1">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <a class="wordmark" href="{{ root }}">
        <img src="{{ root }}site/assets/crabpdf-logo.svg" width="32" height="32" alt="">
        CrabPDF
      </a>
      <a href="{{ root }}historial/">Versión {{ version }}</a>
      <a href="https://github.com/MHAlberto/crabpdf/blob/main/LICENSE">Licencia MIT</a>
      <a href="https://github.com/MHAlberto/crabpdf">Código fuente</a>
    </div>
  </footer>
</body>
</html>
