api_version = 1
id = "org.crabpdf.text-ocr"
name = "OCR de texto"
version = "0.1.0"
host_version = ">=0.7.0, <0.9.0"
target = "@TARGET@"
executable = "@EXE@"
description = "Reconoce texto de una página o selección con Tesseract instalado en tu equipo."

[[commands]]
id = "recognize-spa"
title = "Reconocer texto en español"
input = "region"
output = "text"

[[commands]]
id = "recognize-eng"
title = "Reconocer texto en inglés"
input = "region"
output = "text"
